name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test and typecheck Foreman dashboard plugin
        working-directory: paseo-plugins/foreman-dashboard
        run: |
          npm ci
          npm run typecheck
          npm test
